{% extends "base.html" %}

{% block title %}Welcome - CS Gator{% endblock %}

    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="jumbotron bg-light p-5 rounded shadow">
                <h1 class="display-3 fw-bold text-primary mb-4">Welcome to CS Gator!</h1>

        </div>
    </div>

{% endblock %}
